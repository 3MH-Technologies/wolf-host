name: Wolf Host CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff==0.14.2
      - name: Run ruff
        run: cd backend && ruff check app

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f docker/backend/Dockerfile -t wolfhost-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/frontend/Dockerfile -t wolfhost-frontend:ci .
